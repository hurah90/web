<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root{
    --bg:#000000;
    --panel:#1f0422;
    --accent:#0099ff;
    --text:#eaf2f1;
    --muted:#fffb04;
    --border:#3e2745;
    --der:#88c11e;
    --table:#ddffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  header{
    padding:24px 20px;
    text-align:center;
    border-bottom:1px solid var(--border);
  }
    header h1{
    margin:0 0 6px;
    font-size:1.6rem;
    color:var(--der);
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:.9rem;
  }
  main{
    flex:1;
    display:flex;
    justify-content:center;
    padding:30px 16px;
  }
  table {
  border-collapse: collapse;
  width: 100%;
}
    td, th {
    border: 1px solid var(--text);
    padding: 6px 10px;
    text-align:center;
    }
  form{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:28px;
    width:100%;
    max-width:480px;
  }
  fieldset{
    border:none;
    padding:0;
    margin:0 0 18px;
  }
  legend{
    font-weight:600;
    margin-bottom:10px;
    color:var(--accent);
    font-size:1rem;
  }
  .field{
    margin-bottom:16px;
  }
  label{
    display:block;
    margin-bottom:6px;
    font-size:.9rem;
    color:var(--muted);
  }
  input[type="text"],
  input[type="email"],
  input[type="password"],
  input[type="date"],
  select{
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#0c2222;
    color:var(--text);
    font-size:.95rem;
  }
  input:focus, select:focus{
    outline:none;
    border-color:var(--accent);
  }
  .radio-group, .checkbox-group{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
  }
  .radio-group label, .checkbox-group label{
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--text);
    margin:0;
    font-size:.9rem;
  }
  small{
    display:block;
    color:var(--muted);
    margin-top:4px;
    font-size:.75rem;
  }
  button{
    width:100%;
    padding:42px;
    border:none;
    border-radius:8px;
    background:var(--accent);
    color:#1a1010;
    font-weight:600;
    font-size:5rem;
    cursor:pointer;
  }
  button:hover{
    opacity:.9;
  }
  footer{
    text-align:center;
    padding:16px;
    color:var(--muted);
    font-size:.8rem;
    border-top:1px solid var(--der);
  }
</style>
</head>
<body>

<header>
    <h1>Анкет</h1>
    <p></p>
</header>

<main>
  <form action="#" method="post" novalidate>

    <fieldset>
      <legend>Хувийн мэдээлэл</legend>

      <div class="field">
        <label for="fullname">Нэр</label>
        <input type="text" id="fullname" name="fullname" required minlength="2" placeholder="Хурах-Эрдэнэ">
      </div>

      <div class="field">
        <label for="email">Имэйл</label>
        <input type="email" id="email" name="email" required placeholder="name@gmail.com">
      </div>

      <div class="field">
        <label for="password">Нууц үг</label>
        <input type="password" id="password" name="password" required minlength="8"
               pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"
               title="Хамгийн багадаа 8 тэмдэгт, үсэг болон тоо агуулсан байх ёстой">
        <small>Хамгийн багадаа 8 тэмдэгт, үсэг ба тоо хослуулсан байх</small>
      </div>

      <div class="field">
        <label for="birthdate">Төрсөн огноо</label>
        <input type="date" id="birthdate" name="birthdate" required>
      </div>
    </fieldset>

    <fieldset>
      <legend>Хүйс</legend>
      <div class="radio-group" role="radiogroup" aria-label="Хүйс">
        <label for="gender-male">
          <input type="radio" id="gender-male" name="gender" value="male" required>
          Эрэгтэй
        </label>
        <label for="gender-female">
          <input type="radio" id="gender-female" name="gender" value="female">
          
          Эмэгтэй
        </label>
        <label for="gender-other">
          <input type="radio" id="gender-other" name="gender" value="other">
          Бусад
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Сургууль</legend>
      <div class="checkbox-group">
        <label for="school-tech">
          <input type="checkbox" id="school-tech" name="school" value="must">
          MUST
        </label>
        <label for="school-sport">
          <input type="checkbox" id="school-sport" name="school" value="ufe">
          UFE
        </label>
        <label for="school-music">
          <input type="checkbox" id="school-music" name="school" value="num">
          NUM
        </label>
        <label for="school-art">
          <input type="checkbox" id="school-art" name="school" value="muls">
          MULS
        </label>
      </div>
    </fieldset>

    <fieldset>
        <legend>Миний сонирхол</legend>
            <ul>
                <li>Спорт</li>
                <li>Хөгжим</li>
                <li>Кино</li>
            </ul>
    </fieldset>

    <fieldset>
        <table>
            <legend>Дүн</legend>
        <tr>
            <th>ITM.212</th>
            <th>ITM.128</th>
            <th>ITA.361</th>
        </tr>
        <tr>
            <td>89</td>
            <td>69</td>
            <td>67</td>
        </tr>
        </table>
    </fieldset>

    <fieldset>
      <legend>Нэмэлт мэдээлэл</legend>
      <div class="field">
        <label for="country">Улс</label>
        <select id="country" name="country" required>
          <option value="" disabled selected>-- Улс сонгоно уу --</option>
          <option value="mn">Монгол</option>
          <option value="cn">Хятад</option>
          <option value="ru">Орос</option>
          <option value="kr">Өмнөд Солонгос</option>
          <option value="kr">Хойд Солонгос</option>
          <option value="kr">Герман</option>
          <option value="jp">Япон</option>
          <option value="kr">USSR</option>
          <option value="other">Бусад</option>
        </select>
      </div>
    </fieldset>

    <button type="submit">Бүртгүүлэх</button>
  </form>
</main>

<footer>ЙХӨЙӨМЙГҮШМГЙМЁСҮГЙМСЙСҮШНМЫЙНС УНҮСА ЦУНҮГШАӨҮЦУН АӨ</footer>

</body>
</html>
